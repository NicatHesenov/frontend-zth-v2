<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    />
  </head>
  <body>
    <div class="slide-container">
      <img src="./assets/image1.jpg" alt="" class="slide active" />
      <img src="./assets/image2.jpg" alt="" class="slide" />
      <img src="./assets/image3.jpg" alt="" class="slide" />
      <img src="./assets/image4.jpg" alt="" class="slide" />
      <img src="./assets/image5.jpg" alt="" class="slide" />
      <div class="slide-button">
        <button class="btn-left">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="btn-right">
          <i class="fa-solid fa-angle-right"></i>
        </button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
