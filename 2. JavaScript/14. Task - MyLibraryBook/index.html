<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Mənim Kitabxanam</h1>
    <div class="library">
      <div class="library__container">
        <h2>Yeni Kitab Əlavə Et</h2>
        <div class="library__content">
          <input class="name-input" type="text" placeholder="Kitabın adı" />
          <input class="author-input" type="text" placeholder="Müəllif" />
          <div class="library-check">
            <span>Oxumusan?</span> <input class="check-input" type="checkbox" />
          </div>
          <button class="library-btn">Kitabxanaya əlavə et</button>
        </div>
      </div>

      <div class="library__card">
        <div class="card__container"></div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
