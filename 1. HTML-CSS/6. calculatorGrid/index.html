<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="calculator__container">
      <div class="calculator__content">
        <input
          type="text"
          placeholder="0"
          class="calculator__display"
          readonly
        />

        <div class="calculator__functions">
          <button>MC</button>
          <button>MR</button>
          <button>MS</button>
          <button>M+</button>
          <button>M-</button>

          <button>&larr;</button>
          <button>CE</button>
          <button>C</button>
          <button>&plusmn;</button>
          <button>&radic;</button>

          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>/</button>
          <button>%</button>

          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>*</button>
          <button>1/x</button>

          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>-</button>
          <button class="btn--equal">=</button>

          <button class="btn--zero">0</button>
          <button>,</button>
          <button>+</button>
        </div>
      </div>
    </div>
  </body>
</html>
