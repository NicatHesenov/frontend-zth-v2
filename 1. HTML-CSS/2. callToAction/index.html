<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

  <body>
    <main class="container">
      <div class="container__card">
        <article class="container__card__box">
          <div class="container__card__box--item">
            <h1>Already working together?</h1>
            <p>
              log in to your occount and connect with <br />
              your teammates!
            </p>
            <div class="input">
              <input type="text" placeholder="your email adress" />

              <i class="fa-solid fa-circle-arrow-right"></i>
            </div>
          </div>
          <div class="container__card__box--imgs">
            <img src="./img/profil1.jpg" alt="" />
            <img class="img" src="./img/profil2.jpg" alt="" />
            <img src="./img/profil3.jpg" alt="" />
            <img src="./img/profil4.jpg" alt="" />
            <img src="./img/profil5.jpg" alt="" />
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
